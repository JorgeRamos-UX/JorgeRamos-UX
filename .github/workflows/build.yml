# Regenera los SVG y el README en GitHub: no hace falta tener Python instalado.
# Corre al subir cambios a build.py, a mano desde la pestaña Actions, y una vez al mes
# (así la fecha "updated …" del pie no se queda vieja).
name: Build profile

on:
  push:
    branches: [main]
    paths: [build.py, assets/src/**, .github/workflows/build.yml]
  workflow_dispatch:
  schedule:
    - cron: "0 12 1 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python build.py
      - name: Commit si algo cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md tokens.json assets
          git diff --cached --quiet || (git commit -m "Regenerar perfil" && git push)
